<title>immanence</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* dark-first, after the listening-room reference: near-black, white, one gray */
  :root {
    --bg: #121212;
    --s1: #ffffff;        /* primary ink */
    --s2: #84858c;        /* secondary ink */
    --s3: #4a4b52;        /* dim ink */
    --rule: #2e2e33;
    --focus: #ffffff;
    --ochre: #a08558;      /* first bell choir */
    --slate: #6e8494;      /* canon voice */
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fafafa; --s1: #121212; --s2: #85858c; --s3: #b9b9bf;
      --rule: #e4e4e6; --focus: #121212;
      --ochre: #8a6f42; --slate: #5b7484;
    }
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --s1: #121212; --s2: #85858c; --s3: #b9b9bf;
    --rule: #e4e4e6; --focus: #121212;
    --ochre: #8a6f42; --slate: #5b7484;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--s1);
    font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5; font-weight: 400;
  }
  .row { border-bottom: 1px solid var(--rule); padding: 14px 16px; }
  .row.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 400; margin: 0; }
  .g { color: var(--s2); }
  .d3 { color: var(--s3); }

  #stage { position: relative; border-bottom: 1px solid var(--rule); }
  #viz { display: block; width: 100%; height: 300px; cursor: crosshair; touch-action: manipulation; }
  #begin {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; cursor: pointer; color: var(--s1);
    font: inherit; letter-spacing: 0.02em;
  }
  #begin:hover { color: var(--s2); }
  #begin:focus-visible { outline: 1px solid var(--focus); outline-offset: -8px; }
  #status {
    position: absolute; left: 16px; bottom: 12px; font-size: 13px; color: var(--s2);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #status b { color: var(--ochre); font-weight: 400; }
  #stDay {
    position: absolute; right: 16px; bottom: 12px; font-size: 13px;
    color: var(--s3); font-variant-numeric: tabular-nums; pointer-events: none;
  }

  .sect { padding: 14px 16px 4px; color: var(--s2); font-size: 13px;
          border-bottom: 1px solid var(--rule); }
  .ctl { display: block; border-bottom: 1px solid var(--rule); padding: 12px 16px 16px; }
  .ctl .row2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ctl label { font-size: 16px; }
  .ctl output { font-size: 14px; color: var(--s2); font-variant-numeric: tabular-nums; }
  .ctl.ochre output { color: var(--ochre); }
  .ctl.slate output { color: var(--slate); }
  .ctl.ochre input[type="range"]::-webkit-slider-thumb { background: var(--ochre); }
  .ctl.slate input[type="range"]::-webkit-slider-thumb { background: var(--slate); }
  .ctl.ochre input[type="range"]::-moz-range-thumb { background: var(--ochre); }
  .ctl.slate input[type="range"]::-moz-range-thumb { background: var(--slate); }

  input[type="range"] {
    appearance: none; -webkit-appearance: none; width: 100%; height: 18px;
    background: transparent; cursor: pointer; margin: 0; display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--s1); margin-top: -5px; border: 0;
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: var(--s1); border: 0;
  }
  input[type="range"]:focus-visible { outline: 1px solid var(--focus); outline-offset: 4px; }

  .seg { display: flex; gap: 18px; }
  .seg button, .act, .switch {

  .seg button:focus-visible, .act:focus-visible, .switch:focus-visible {
    outline: 1px solid var(--focus); outline-offset: 4px;

            border-bottom: 1px solid var(--rule); padding: 14px 16px; }
  .inline.between { justify-content: space-between; }

  /* coarse pointers: bigger targets, same language */

    input[type="range"] { height: 32px; }
    input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; margin-top: -9.5px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }

<div class="row head">

<script>
"use strict";
/* ---------------------------------------------------------- material ---- */
const NOTE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function p(name){ // 'F#5' -> midi
  let s=name, step=NOTE[s[0]], i=1;
  while(s[i]==="#"||s[i]==="b"){ step += s[i]==="#"?1:-1; i++; }
  return step + (parseInt(s.slice(i),10)+1)*12;
}
const hz = m => 440*Math.pow(2,(m-69)/12);

/* pedal cells: E4 ticks on odd 16ths, upper voice wheels 9-8-6-5 */
const PEDAL = {
  Em:["E4","F#5","E4","E5","E4","C5","E4","B4"],
  C: ["E4","D5","E4","C5","E4","A4","E4","G4"],
  G: ["E4","D5","E4","B4","E4","A4","E4","G4"],
  D: ["E4","F#5","E4","D5","E4","A4","E4","F#4"],
  B: ["E4","D#5","E4","C#5","E4","B4","E4","F#4"],
};
const CHORD = {
  Em:{ pad:["G3","B3","E4","F#4"], root:"E3", bass:"E2", choir:"F#5" },
  C: { pad:["G3","C4","E4","D5"],  root:"C3", bass:"C3", choir:"D5" },
  G: { pad:["G3","B3","D4","A4"],  root:"G3", bass:"G2", choir:"A4" },
  D: { pad:["A3","D4","F#4","E5"], root:"D3", bass:"D3", choir:"D5" },
  B: { pad:["F#3","B3","D#4","C#5"],root:"B2", bass:"B2", choir:"D#5" },
};
const LOOPS = { axis:["Em","C","G","D"], rise:["C","D","Em","Em"], float:["Em","D","C","D"] };

/* ---- today's weather: drift decisions are seeded by the date, so an
   untouched instrument wanders the same way for everyone on the same day.
   ?day=YYYY-MM-DD replays another day. ---- */
function fnv(str){ let h=2166136261;
  for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
const dayStr=(new URLSearchParams(location.search).get("day")||(()=>{
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
})()).slice(0,10);
const wrng=mulberry32(fnv("immanence:"+dayStr));

/* ---- the tape: everything played, for [ keep .mid ] ---- */
const tape=[];

/* ---- the instrument listens: touched pitches accumulate, decay, and pull
   the resultant voice toward what the player keeps playing ---- */
const heard={}; let heardTotal=0, curResultant=null;
function hear(midi){ heard[midi]=(heard[midi]||0)+1; heardTotal+=1; }
function topHeard(){ let bp=null,bw=0;
  for(const k in heard) if(heard[k]>bw){ bw=heard[k]; bp=+k; } return bp; }
function decayHeard(){ heardTotal=0;
  for(const k in heard){ heard[k]*=0.88;
    if(heard[k]<0.2) delete heard[k]; else heardTotal+=heard[k]; } }
function resultantPitch(ch){
  const th=topHeard();
  if(th!=null && heardTotal>=2.5 && Math.random()<Math.min(0.85,heardTotal/10)){
    let m=th; while(m>81)m-=12; while(m<62)m+=12; return m;
  }
  return p(CHORD[ch].choir);
}
const BLOOM_ORDER = [0,4,2,6,1,5,3,7];
const ROLL_CELL = ["E5","B5","E6"];

/* ------------------------------------------------------------- synth ---- */
let ctx=null, wetGain, dryGain, comp, buffers=new Map();

/* one-pole + biquad helpers operating on Float32Array in place */
function lowpass(x, sr, fc){ const a=Math.exp(-2*Math.PI*fc/sr); let y=0;
  for(let i=0;i<x.length;i++){ y=a*y+(1-a)*x[i]; x[i]=y; } }
function highpass(x, sr, fc){ const a=Math.exp(-2*Math.PI*fc/sr); let lp=0;
  for(let i=0;i<x.length;i++){ lp=a*lp+(1-a)*x[i]; x[i]=x[i]-lp; } }
function bandpass(x, sr, fc, q){ // constant-skirt biquad, returns new array
  const w=2*Math.PI*fc/sr, alpha=Math.sin(w)/(2*q), b0=alpha, b2=-alpha,
        a0=1+alpha, a1=-2*Math.cos(w), a2=1-alpha;
  const y=new Float32Array(x.length); let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<x.length;i++){ const v=(b0*x[i]+b2*x2-a1*y1-a2*y2)/a0;
    x2=x1;x1=x[i];y2=y1;y1=v;y[i]=v; }
  return y;
}

/* bell family = modal bars: partial ratios, weights, decays */
const BARS = {
  handbell:{ r:[1,3,5.43,9.2], w:[1,0.42,0.10,0.03], t:[2.6,1.0,0.45,0.2],
             slope:-0.45, mall:[600,2600,0.09] },
  tubular: { r:[0.5,1,1.2,1.5,2,2.67,3.01,4.19],
             w:[0.35,1,0.6,0.32,0.5,0.18,0.11,0.05],
             t:[11,7.5,5.5,4.2,3.2,2,1.4,0.9], slope:-0.4, mall:[800,4200,0.16] },
  glock:   { r:[1,2.71,5.15,8.44], w:[0.3,1,0.85,0.45], t:[0.85,1.5,1.05,0.6],
             slope:-0.35, mall:[2200,9000,0.14] },
  crotale: { r:[1,2,3.01,4.19,5.43], w:[0.7,1,0.72,0.45,0.26], t:[9,7,5,3.2,2],
             slope:-0.25, mall:[3000,11000,0.1] },
  vibes:   { r:[1,3.98,10.7], w:[1,0.24,0.085], t:[7.5,3.4,1.5],
             slope:-0.4, mall:[800,4200,0.05], motor:[2.4,0.5] },
};
function bellBuffer(kind, midi, damp){
  const sr=ctx.sampleRate, B=BARS[kind], f0=hz(midi);
  const reg=Math.pow(2, B.slope*(midi-60)/12), dampf=damp??1;
  const dur=Math.min(9, Math.max(0.25, B.t[B.r.indexOf(Math.max(...B.r))>=0?1:0]*reg*dampf*1.05, B.t[1]*reg*dampf));
  const n=Math.floor(sr*Math.min(9, Math.max(...B.t)*reg*dampf*0.8)+sr*0.05);
  const x=new Float32Array(n);
  for(let k=0;k<B.r.length;k++){
    const f=f0*B.r[k]; if(f>sr*0.45) break;
    const t60=B.t[k]*reg*dampf, dk=6.9078/(sr*t60), ph=Math.random()*6.283,
          jit=1+(Math.random()-0.5)*0.0018*(k>0?1:0), w=B.w[k],
          om=2*Math.PI*f*jit/sr;
    let env=w;
    for(let i=0;i<n;i++){ x[i]+=env*Math.sin(om*i+ph); env*=(1-dk); if(env<1e-4&&k>0)break; }
  }
  /* mallet: filtered noise burst */
  const mn=Math.floor(sr*0.012), m=new Float32Array(mn);
  for(let i=0;i<mn;i++) m[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.004));
  const mb=bandpass(m, sr, (B.mall[0]+B.mall[1])/2, 1.2);
  for(let i=0;i<mn;i++) x[i]+=mb[i]*B.mall[2]*8;
  if(B.motor){ const [mf,md]=B.motor, ph2=Math.random()*6.283;
    for(let i=0;i<n;i++) x[i]*=1-md*0.5*(1-Math.cos(2*Math.PI*mf*i/sr+ph2)); }
  /* attack shape + normalize */
  const ak=Math.floor(sr*0.0015);
  for(let i=0;i<ak;i++) x[i]*=i/ak;
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(x[i]));
  if(peak>0) for(let i=0;i<n;i++) x[i]/=peak;
  const buf=ctx.createBuffer(1,n,sr); buf.copyToChannel(x,0); return buf;
}
function choirBuffer(midi, dur){
  /* the resultant voice: a BOWED BELL. Two barely-detuned units of a
     near-pure tone (strong fundamental, faint 2nd and 3rd partials) beat
     slowly against each other under a slow swell, with a whisper of bow
     noise. Bowed metal sings WITH the bells instead of sitting on top. */
  const sr=ctx.sampleRate, n=Math.floor(sr*(dur+1.6)), f0=hz(midi);
  const out=new Float32Array(n);
  for(const det of [-0.0007, 0.0008]){
    let ph=Math.random()*6.283, drift=0;
    const p2=Math.random()*6.283, p3=Math.random()*6.283;
    for(let i=0;i<n;i++){
      drift=0.9995*drift+0.0005*(Math.random()*2-1);
      ph+=2*Math.PI*f0*(1+det)*Math.pow(2,4*drift/1200)/sr;
      out[i]+=0.5*(Math.sin(ph)+0.14*Math.sin(2*ph+p2)+0.05*Math.sin(3*ph+p3))
             +(Math.random()*2-1)*0.006;
    }
  }
  lowpass(out,sr,2800); lowpass(out,sr,2800);
  for(let i=0;i<n;i++){ const t=i/sr;
    const env=Math.pow(Math.min(1,t/1.1),1.5)*Math.min(1,Math.max(0,(dur+1.6-t)/1.6));
    out[i]*=env; }
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(out[i]));
  if(peak>0) for(let i=0;i<n;i++) out[i]/=peak;
  const buf=ctx.createBuffer(1,n,sr); buf.copyToChannel(out,0); return buf;
}
function stringBuffer(midi, dur){
  const sr=ctx.sampleRate, n=Math.floor(sr*(dur+1.6)), f0=hz(midi);
  const x=new Float32Array(n), det=[-0.006,-0.003,0,0.003,0.006];
  for(const d of det){ let ph=Math.random();
    const inc=f0*(1+d*0.35)/sr;
    for(let i=0;i<n;i++){ ph+=inc; x[i]+=(2*(ph%1)-1)*0.2; } }
  lowpass(x,sr,2400); lowpass(x,sr,2400); highpass(x,sr,Math.max(60,f0*0.8));
  for(let i=0;i<n;i++){ const t=i/sr;
    x[i]*=Math.pow(Math.min(1,t/1.1),1.4)*Math.min(1,Math.max(0,(dur+1.6-t)/1.6)); }
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(x[i]));
  if(peak>0) for(let i=0;i<n;i++) x[i]/=peak;
  const buf=ctx.createBuffer(1,n,sr); buf.copyToChannel(x,0); return buf;
}
function reedBuffer(midi, dur){
  const sr=ctx.sampleRate, n=Math.floor(sr*(dur+0.4)), f0=hz(midi);
  const x=new Float32Array(n); let ph=0, wob=0;
  for(let i=0;i<n;i++){
    wob=0.9995*wob+0.0005*(Math.random()*2-1);
    ph+=2*Math.PI*f0*Math.pow(2,2.5*wob/12)/sr;
    let s=0; for(let k=1;k<=11;k+=2) s+=Math.pow(k,-1.5)*Math.sin(k*ph);
    x[i]=s;
  }
  lowpass(x,sr,700); lowpass(x,sr,700);
  for(let i=0;i<n;i++){ const t=i/sr;
    x[i]*=Math.min(1,t/0.08)*Math.min(1,Math.max(0,(dur+0.4-t)/0.25)); }
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(x[i]));
  if(peak>0) for(let i=0;i<n;i++) x[i]/=peak;
  const buf=ctx.createBuffer(1,n,sr); buf.copyToChannel(x,0); return buf;
}
function getBuffer(kind, midi, opt){
  const key=kind+"|"+midi+"|"+(opt??"");
  let b=buffers.get(key);
  if(!b){
    if(kind==="choir") b=choirBuffer(midi, 8);
    else if(kind==="strings") b=stringBuffer(midi, 8);
    else if(kind==="reed") b=reedBuffer(midi, 8);
    else b=bellBuffer(kind, midi, opt??1);
    buffers.set(key,b);
  }
  return b;
}
function strike(kind, midi, when, gain, panv, opt, durCap){
  const b=getBuffer(kind, midi, opt);
  tape.push({t:when, kind, midi, v:gain, d:durCap||Math.min(b.duration,6)});
  if(tape.length>24000) tape.splice(0,4000);
  const src=ctx.createBufferSource(); src.buffer=b;
  src.playbackRate.value=Math.pow(2,(Math.random()*6-3)/1200); /* shimmer */
  const g=ctx.createGain(); g.gain.value=gain;
  if(durCap && durCap<b.duration){
    g.gain.setValueAtTime(gain, when+durCap-0.12);
    g.gain.linearRampToValueAtTime(0.0001, when+durCap);
  }
  const pan=ctx.createStereoPanner(); pan.pan.value=panv;
  src.connect(g); g.connect(pan); pan.connect(dryGain); pan.connect(wetGain);
  src.start(when);
}

/* --------------------------------------------------------- the piece ---- */
const P = { /* live parameters */
  bloom:1, canon64:12, roll:0, aug:0, loop:"axis", chordBars:4,
  vToll:0.7, vChoir:0.55, vStr:0.4, vBass:0.6,
  tempo:120, space:0.35, damp:0.55, drift:true, cadence:false,
};

/* tides: two very slow cycles, seeded by the day before any weather draws */
const TIDE1_LEN=800+Math.floor(wrng()*500), TIDE1_PH=wrng()*6.283;
const TIDE2_LEN=2100+Math.floor(wrng()*900), TIDE2_PH=wrng()*6.283;
function tide(b){ return 0.5-0.5*Math.cos(2*Math.PI*b/TIDE1_LEN+TIDE1_PH); }
function tide2(b){ return 0.5-0.5*Math.cos(2*Math.PI*b/TIDE2_LEN+TIDE2_PH); }

/* a performable tihai: three statements landing on a chord boundary */
let tihaiQ=[], tihaiLand=null;
function armTihai(){
  if(tihaiLand!=null) return;
  const chordBeats=P.chordBars*4;
  const land=Math.ceil((beat+8.5)/chordBeats)*chordBeats;
  const start=land-7.0, PH=["B5","G5","E5"].map(p);
  tihaiQ=[];
  for(let st=0;st<3;st++)
    for(let i=0;i<3;i++)
      tihaiQ.push({b:start+st*2.75+i*0.5, midi:PH[i], g:0.42+0.07*st});
  tihaiQ.push({b:land, midi:p("E6"), g:0.5, crotale:true});
  tihaiLand=land;
}

/* the coda: a performed ending — dissolution, ritard, one last toll */
let coda=null;
function codaStep(b){
  const bars=Math.max(0,(b-coda.start)/4);
  P.tempo=coda.tempo0*(1-0.16*Math.min(1,bars/coda.bars)); reflect("tempo");
  if(b%4===0 && b>coda.start){
    P.bloom=Math.max(1,P.bloom-1); reflect("bloom");
    P.roll*=0.7; reflect("roll");
    P.aug*=0.75; reflect("aug");
    P.vStr*=0.85; reflect("vStr");
    if(bars>coda.bars-3){ P.vChoir*=0.8; P.vToll*=0.95; }
  }
}
function finishCoda(t0){
  strike("tubular", p("E3"), t0, 0.9, -0.1);
  strike("tubular", p("E2"), t0+0.05, 0.5, 0.1);
  strike("crotale", p("E6"), t0+spb()*0.5, 0.45, 0.3);
  strike("choir", p("E5"), t0+spb(), 0.35, 0, null, 6.0);
  visEvents.push({t:t0,kind:"cadence",midi:p("E3")});
  visEvents.push({t:t0+spb()*0.5,kind:"toll",midi:p("E2")});
  running=false;
  setTimeout(()=>{
    if(ctx){ ctx.onstatechange=null; ctx.suspend(); }
    const stage=document.getElementById("stage");
    const b2=document.createElement("button");
    b2.id="begin"; b2.textContent="[ again ]";
    b2.addEventListener("click",()=>location.reload());
    stage.appendChild(b2); b2.focus();
  }, 9000);
}
const manual = new Set();  /* params touched while drift is on */

let beat=0, nextTime=0, chordIdx=0, running=false;
let weather = { mode:"blooming", until: 24, tollGap:1 };
const visEvents = [];

function chordName(){
  if(P.cadence && chordIdx===LOOPS[P.loop].length-1) return "B";
  return LOOPS[P.loop][chordIdx % LOOPS[P.loop].length];
}
function spb(){ return 60/P.tempo; }

function scheduleBeat(t0, beatIdx){
  const ch=chordName(), cell=PEDAL[ch], chordBeats=P.chordBars*4;
  const posInChord=beatIdx % chordBeats;
  const sixteenth=spb()/4;
  const drift1=Math.sin(beatIdx*0.13)*0.004, drift2=Math.sin(beatIdx*0.11+2)*0.004;

  /* chord boundary: pads, bass, choir, toll root */
  if(posInChord===0){
    const C=CHORD[ch];
    curResultant=resultantPitch(ch);
    decayHeard();
    if(P.vStr>0.02) C.pad.forEach((nm,i)=>
      strike("strings", p(nm), t0+0.01*i, P.vStr*0.16, (i%2? 0.5:-0.5), null, chordBeats*spb()));
    if(P.vBass>0.02) strike("reed", p(C.bass), t0, P.vBass*0.30, 0, null, chordBeats*spb()*0.95);
    if(P.vChoir>0.02){
      strike("choir", curResultant, t0+spb()*0.5, P.vChoir*0.42, 0.15, null, chordBeats*spb());
      visEvents.push({t:t0+spb()*0.8, kind:"choir", midi:curResultant});
    }
  }
  /* toll on bar downbeats (weather can thin it) */
  if(beatIdx%4===0 && (beatIdx/4)%weather.tollGap===0 && P.vToll>0.02){
    strike("tubular", p(CHORD[ch].root), t0, P.vToll*0.5, -0.15);
    visEvents.push({t:t0, kind:"toll", midi:p(CHORD[ch].root)});
  }
  /* the two bell voices: cell + canon */
  const present=new Set(BLOOM_ORDER.slice(0,P.bloom));
  const canonDelay=(P.canon64/16)*spb();
  for(let s=0;s<4;s++){
    const slot=(beatIdx%2)*4+s;
    if(!present.has(slot)) continue;
    const midi=p(cell[slot]);
    const arc=1-0.25*Math.abs(((slot/8)-0.62));
    const jit=()=> (Math.random()-0.5)*0.007;
    strike("handbell", midi, t0+s*sixteenth+drift1+jit(), 0.34*arc*(slot%2?1:0.8), -0.55, P.damp);
    strike("handbell", midi, t0+s*sixteenth+canonDelay+drift2+jit(), 0.24*arc, 0.55, P.damp);
    visEvents.push({t:t0+s*sixteenth, kind:"bell", midi});
    visEvents.push({t:t0+s*sixteenth+canonDelay, kind:"canon", midi});
  }
  /* augmentation canon: the same cell, eight times slower, an octave down,
     on the tubulars — construction (the bloom mask) applies to it too */
  if(P.aug>0.02 && beatIdx%2===0){
    const slot=((beatIdx/2)|0)%8;
    if(present.has(slot)){
      strike("tubular", p(cell[slot])-12, t0+drift2, P.aug*0.4, 0.15, 0.75);
      visEvents.push({t:t0, kind:"aug", midi:p(cell[slot])-12});
    }
  }
  /* the armed tihai: emit any of its notes falling inside this beat */
  if(tihaiLand!=null){
    for(const n of tihaiQ){
      if(n.b>=beatIdx && n.b<beatIdx+1){
        const tt=t0+(n.b-beatIdx)*spb();
        strike(n.crotale?"crotale":"handbell", n.midi, tt, n.g, 0.0, n.crotale?null:P.damp);
        visEvents.push({t:tt, kind:"cadence", midi:n.midi});
      }
    }
    if(beatIdx>=tihaiLand){ tihaiLand=null; tihaiQ=[];
      const tb=document.getElementById("tihai");
      tb.disabled=false; tb.textContent="[ tihai ]"; }
  }
  /* rolling 3-cell */
  if(P.roll>0.02){
    for(let s=0;s<4;s++){
      const step16=beatIdx*4+s;
      const midi=p(ROLL_CELL[step16%3]);
      strike("glock", midi, t0+s*sixteenth+drift2, P.roll*0.14, 0.35);
      if(step16%3===0) visEvents.push({t:t0+s*sixteenth, kind:"roll", midi});
    }
  }
  /* sparse crotale shimmer over the choir tone */
  if(P.vChoir>0.05 && Math.random()<0.06){
    strike("crotale", (curResultant??p(CHORD[ch].choir))+12, t0+Math.floor(Math.random()*4)*sixteenth, 0.10, -0.65);
  }
  /* cadence: the one D#, then release */
  if(P.cadence && chordIdx===LOOPS[P.loop].length-1 && posInChord===0){
    strike("tubular", p("B2"), t0, 0.55, 0.1);
    strike("tubular", p("D#4"), t0+2*spb(), 0.4, 0.2);
    visEvents.push({t:t0, kind:"cadence", midi:p("B2")});
  }
  if(posInChord===chordBeats-1){ /* advance harmony at boundary */
    if(P.cadence && chordIdx===LOOPS[P.loop].length-1){ P.cadence=false;
      el.cadence.disabled=false; el.cadence.textContent="[ cadence ]"; }
    chordIdx=(chordIdx+1)%LOOPS[P.loop].length;
  }
}

function weatherStep(){
  if(coda) { weather.mode="coda"; return; }
  if(!P.drift) { weather.mode="held"; return; }
  const td=tide(beat), td2=tide2(beat);
  if(!manual.has("space")){ P.space=0.24+0.20*td2;
    if(wetGain) wetGain.gain.value=P.space*0.9; reflect("space"); }
  weather.until--;
  const set=(k,v)=>{ if(!manual.has(k)){ P[k]=v; reflect(k); } };
  if(weather.until<=0){
    const roll=wrng();
    if(weather.mode!=="recession" && roll<0.10+0.16*(1-td)){
      weather.mode="recession"; weather.until=16+Math.floor(wrng()*8);
      weather.tollGap=2;
    } else if(weather.mode==="recession"){
      weather.mode="blooming"; weather.until=24+Math.floor(wrng()*24);
      weather.tollGap=1;
    } else if(roll>0.9 && !P.cadence){
      P.cadence=true; el.cadence.disabled=true;
      weather.mode="cadence"; weather.until=P.chordBars*4*LOOPS[P.loop].length/4;
    } else {
      weather.mode="blooming"; weather.until=16+Math.floor(wrng()*24);
    }
  }
  if(weather.mode==="recession"){
    set("bloom", Math.max(2, P.bloom-(wrng()<0.4?1:0)));
    set("roll", Math.max(0, P.roll-0.08));
    set("aug", Math.max(0, P.aug-0.06));
    set("vStr", Math.max(0.15, P.vStr-0.02));
  } else if(weather.mode==="blooming"){
    const bloomCap=3+Math.round(5*td);          /* the tide caps the bloom */
    if(wrng()<0.30) set("bloom", Math.min(bloomCap, P.bloom+1));
    if(wrng()<0.18) set("roll", Math.min(0.25+0.55*td, P.roll+0.08));
    if(wrng()<0.10) set("aug", Math.min(0.20+0.45*td, P.aug+0.07));
    if(wrng()<0.12) set("canon64", Math.max(4, Math.min(28, P.canon64+(wrng()<0.5?-1:1))));
    if(wrng()<0.10) set("vStr", Math.min(0.7, P.vStr+0.03));
  }
}

function tick(){
  if(!running) return;
  const ahead=0.35;
  /* after background throttling, jump to now rather than replaying the gap */
  if(nextTime < ctx.currentTime - 0.25) nextTime = ctx.currentTime + 0.1;
  while(nextTime < ctx.currentTime + ahead){
    if(coda){
      codaStep(beat);
      if(beat-coda.start>=coda.bars*4){ finishCoda(nextTime); status(); return; }
    }
    scheduleBeat(nextTime, beat);
    if(beat%4===0) weatherStep();
    beat++; nextTime+=spb();
  }
  status();
  setTimeout(tick, 100);
}

/* ---------------------------------------------------------------- UI ---- */
const el={};
["bloom","canon","roll","aug","chordlen","vToll","vChoir","vStr","vBass","tempo",
 "space","damp","cadence","drift","begin","stChord","stLoop","stWeather","status"]
 .forEach(id=>el[id]=document.getElementById(id));
const out=id=>document.getElementById(id+"V");

const FRAC={0:"unison",4:"1/16",8:"1/8",12:"3/16",16:"1/4",20:"5/16",24:"3/8",28:"7/16",32:"1/2"};
function reflect(k){
  if(k==="bloom"){ el.bloom.value=P.bloom; out("bloom").textContent=P.bloom+"/8"; }
  if(k==="aug"){ const e=document.getElementById("aug"); e.value=Math.round(P.aug*100);
    out("aug").textContent=P.aug<0.02?"off":Math.round(P.aug*100); }
  if(k==="space"){ el.space.value=Math.round(P.space*100);

  if(k==="canon64"){ el.canon.value=P.canon64;
    out("canon").textContent=FRAC[P.canon64] ?? (P.canon64/16).toFixed(2)+" beat"; }
  if(k==="roll"){ el.roll.value=Math.round(P.roll*100);
    out("roll").textContent=P.roll<0.02?"off":Math.round(P.roll*100); }
  if(k==="vStr"){ el.vStr.value=Math.round(P.vStr*100); out("vStr").textContent=Math.round(P.vStr*100); }
}
function bind(id, key, fmt, scale){
  el[id].addEventListener("input", ()=>{
    manual.add(key);
    P[key]=scale? el[id].value*scale : +el[id].value;
    out(id).textContent=fmt(P[key]);

}

el.begin.addEventListener("click", async ()=>{
  if(running) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  /* iOS: route through the media channel so the silent switch doesn't mute */
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  await ctx.resume();
  /* iOS suspends on screen lock / interruptions; resume whenever we can */
  ctx.onstatechange=()=>{ if(ctx.state!=="running" && !document.hidden) ctx.resume(); };
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && ctx && ctx.state!=="running") ctx.resume();
  });
  document.addEventListener("touchend",()=>{
    if(ctx && ctx.state!=="running") ctx.resume();
  },{passive:true});
  /* keep the screen awake while playing — never gate audio startup on it */
  const grabLock=()=>{ if(navigator.wakeLock)
    navigator.wakeLock.request("screen").catch(()=>{}); };
  grabLock();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) grabLock(); });
  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=3; comp.attack.value=0.01; comp.release.value=0.2;
  dryGain=ctx.createGain(); dryGain.gain.value=0.8;
  wetGain=ctx.createGain(); wetGain.gain.value=P.space*0.9;
  /* synthesized stereo hall */
  const sr=ctx.sampleRate, irN=Math.floor(sr*2.8), ir=ctx.createBuffer(2,irN,sr);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); let lp=0;
    const a=Math.exp(-2*Math.PI*5200/sr);
    for(let i=0;i<irN;i++){ const t=i/sr;
      const nz=(Math.random()*2-1)*Math.exp(-t*2.6)*Math.min(1,t/0.03);
      lp=a*lp+(1-a)*nz; d[i]=lp*3; } }
  const conv=ctx.createConvolver(); conv.buffer=ir;
  dryGain.connect(comp); wetGain.connect(conv); conv.connect(comp); comp.connect(ctx.destination);
  running=true; beat=0; chordIdx=0; nextTime=ctx.currentTime+0.15;
  el.begin.remove(); el.status.hidden=false;
  const sd=document.getElementById("stDay");
  sd.textContent=dayStr; sd.hidden=false;
  tick(); draw();
});

const STRIKE_SCALE=["E4","F#4","G4","A4","B4","C5","D5","E5","F#5","G5","A5","B5","C6","D6","E6"].map(p);
document.getElementById("viz").addEventListener("pointerdown",(e)=>{
  if(!running) return;
  const r=e.currentTarget.getBoundingClientRect();
  const u=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const midi=STRIKE_SCALE[Math.min(STRIKE_SCALE.length-1,Math.floor(u*STRIKE_SCALE.length))];
  /* quantize to the next 16th of the already-scheduled grid: always lands */
  const six=spb()/4;
  let tq=nextTime;
  while(tq-six>ctx.currentTime+0.02) tq-=six;
  strike("handbell", midi, tq, 0.5, (u*2-1)*0.5, P.damp);
  hear(midi);
  visEvents.push({t:tq, kind:"touch", midi});
},{passive:true});

/* ------------------------------------------------------- [ keep .mid ] ---- */
const PPQ=960;
function vlq(n){ const out=[n&0x7F]; n>>>=7;
  while(n){ out.push((n&0x7F)|0x80); n>>>=7; } return out.reverse(); }
function trackChunk(name,events){
  const body=[]; const nm=Array.from(new TextEncoder().encode(name)).slice(0,60);
  body.push(...vlq(0),0xFF,0x03,nm.length,...nm);
  let t=0;
  for(const [tick,ord,data] of events.sort((a,b)=>a[0]-b[0]||a[1]-b[1])){
    body.push(...vlq(Math.max(0,tick-t)),...data); t=tick;
  }
  body.push(...vlq(0),0xFF,0x2F,0x00);
  const L=body.length;
  return [0x4D,0x54,0x72,0x6B,(L>>>24)&255,(L>>>16)&255,(L>>>8)&255,L&255,...body];
}
function buildMidi(){
  const now=ctx?ctx.currentTime:0;
  const ev=tape.filter(e=>e.t>=now-300 && e.t<=now+0.5);
  if(ev.length<4) return null;
  const t0=Math.min(...ev.map(e=>e.t));
  const tps=P.tempo/60*PPQ;
  const us=Math.round(60000000/P.tempo);
  const tracks=[trackChunk("immanence "+dayStr,
    [[0,0,[0xFF,0x51,0x03,(us>>>16)&255,(us>>>8)&255,us&255]]])];
  for(const k of [...new Set(ev.map(e=>e.kind))]){
    const notes=ev.filter(e=>e.kind===k).map(e=>{
      const a=Math.max(0,Math.round((e.t-t0)*tps));
      return [a, Math.max(a+1,Math.round((e.t-t0+Math.min(e.d,8))*tps)),
              Math.max(0,Math.min(127,Math.round(e.midi))), e.v];
    }).sort((x,y)=>x[0]-y[0]||x[2]-y[2]);
    const gmax=Math.max(1e-6,...notes.map(n=>n[3]));
    const last={}, keep=[];
    for(const n of notes){                 /* same-pitch overlap repair */
      const pv=last[n[2]];
      if(pv){ if(pv[0]===n[0]){ pv[3]=Math.max(pv[3],n[3]); continue; }
              if(pv[1]>n[0]) pv[1]=n[0]; }
      last[n[2]]=n; keep.push(n);
    }
    const evs=[];
    for(const [a,b,pitch,g] of keep){
      const vel=Math.max(1,Math.min(127,
        Math.round(110+20*Math.log10(Math.max(1e-4,g/gmax))*(10/3))));
      evs.push([a,1,[0x90,pitch,vel]]);
      evs.push([b,0,[0x80,pitch,64]]);
    }
    tracks.push(trackChunk(k,evs));
  }
  const nt=tracks.length;
  return new Uint8Array([0x4D,0x54,0x68,0x64,0,0,0,6,0,1,
    (nt>>>8)&255,nt&255,(PPQ>>>8)&255,PPQ&255,
    ...tracks.flat()]);
}
document.getElementById("keep").addEventListener("click",async ()=>{
  const btn=document.getElementById("keep");
  const say=(t,ms)=>{ btn.textContent=t;
    if(ms) setTimeout(()=>btn.textContent="[ keep .mid ]",ms); };
  const bytes=buildMidi();
  if(!bytes){ say("[ nothing yet ]",1400); return; }
  const hm=new Date();
  const name="immanence-"+dayStr.replaceAll("-","")+"-"
    +String(hm.getHours()).padStart(2,"0")+String(hm.getMinutes()).padStart(2,"0")+".mid";
  /* claude.ai artifact viewer: saves are mediated; elsewhere, plain anchor */
  const dl=(window.claude&&window.claude.use)? await window.claude.use("downloads") : null;
  if(dl){
    try{ await dl.save({filename:name, data:bytes}); say("[ kept ]",1400); }
    catch(err){
      if(err&&err.code==="rejected_extension"){
        /* .mid is outside the viewer's allowlist: same bytes as .mid.txt */
        try{ await dl.save({filename:name+".txt", data:bytes});
             say("[ kept — rename to .mid ]",3200); }
        catch(e2){ say(e2&&e2.code==="declined"?"[ keep .mid ]":"[ unavailable here ]",1600); }
      } else if(err&&err.code==="declined"){ say("[ keep .mid ]"); }
      else { say("[ unavailable here ]",1600); }
    }
    return;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:"audio/midi"}));
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  say("[ kept ]",1400);
});

/* --------------------------------------------------------------- viz ---- */
const cv=document.getElementById("viz"), g2=cv.getContext("2d");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const live=[];
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function draw(){
  if(!running) return;
  const W=cv.width=cv.clientWidth*devicePixelRatio, H=cv.height=cv.clientHeight*devicePixelRatio;
  const now=ctx.currentTime;
  while(visEvents.length && visEvents[0].t<=now+0.02){
    const e=visEvents.shift();
    if(e.t>now-0.1) live.push({...e, born:now});
  }
  g2.clearRect(0,0,W,H);
  const colors={bell:cssVar("--ochre"), canon:cssVar("--slate"), toll:cssVar("--s1"),
                roll:cssVar("--s3"), choir:cssVar("--slate"), cadence:cssVar("--ochre"),
                touch:cssVar("--s1"), aug:cssVar("--slate")};
  for(let i=live.length-1;i>=0;i--){
    const e=live[i], age=now-e.born,
          life=e.kind==="toll"?4.5:e.kind==="cadence"?6:e.kind==="choir"?5:e.kind==="touch"?2.2:e.kind==="aug"?3.5:1.6;
    if(age>life){ live.splice(i,1); continue; }
    const u=age/life, x=(0.12+0.76*((e.midi%24)/24))*W,
          y=e.kind==="toll"||e.kind==="cadence" ? H*0.8 : H*(0.72-0.5*((e.midi-52)/40));
    g2.beginPath();
    const r=reduced? 6*devicePixelRatio : (4+u*(e.kind==="toll"?170:e.kind==="choir"?120:52))*devicePixelRatio;
    g2.arc(x,y,r,0,6.284);
    g2.strokeStyle=colors[e.kind]||colors.bell;
    g2.globalAlpha=(1-u)*(e.kind==="toll"?0.55:e.kind==="touch"?0.85:0.5);
    g2.lineWidth=(e.kind==="touch"?1.8:1)*devicePixelRatio;
    g2.stroke(); g2.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}
</script>
